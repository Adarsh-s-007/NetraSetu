name: tests

on:
  push:
  pull_request:

jobs:
  octave:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install GNU Octave with the image and statistics packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave octave-image octave-statistics
      - name: Run the test suite
        run: |
          octave-cli --no-gui --eval "cd tests; s = run_tests(); exit(double(isempty(s) || ~all([s.passed])))"
